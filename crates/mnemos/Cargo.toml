[package]
name = "converge-mnemos-knowledge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Self-learning knowledgebase with vector search, gRPC, and MCP interfaces. Implements Converge recall and storage suggestors."
keywords = ["vector-database", "knowledge-base", "embeddings", "grpc", "converge"]
categories = ["database", "science"]
exclude = ["target/*", "target/"]

[lib]
name = "mnemos"
path = "src/lib.rs"

[dependencies]
# Converge contract
converge-pack.workspace = true

# Async runtime
tokio.workspace = true
tokio-stream.workspace = true

# gRPC / Protobuf
tonic.workspace = true
prost.workspace = true
prost-types.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
bincode.workspace = true

# Markdown parsing
pulldown-cmark.workspace = true

# Error handling
thiserror.workspace = true
anyhow.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# Utilities
uuid.workspace = true
chrono.workspace = true
parking_lot.workspace = true
dashmap.workspace = true
async-trait.workspace = true

# Math
rand.workspace = true

# HTTP client (OpenAI embeddings)
reqwest.workspace = true

# Pattern matching for routing
regex.workspace = true

# CLI
clap = { workspace = true, optional = true }

[build-dependencies]
tonic-build.workspace = true

[dev-dependencies]
criterion.workspace = true
tempfile.workspace = true
tokio-test.workspace = true

[features]
default = ["cli", "grpc"]
cli = ["dep:clap"]
grpc = []
memory-only = []

[[bin]]
name = "mnemos"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "mnemos-server"
path = "src/bin/server.rs"
required-features = ["grpc"]

[[bench]]
name = "vector_search"
harness = false

[lints]
workspace = true
