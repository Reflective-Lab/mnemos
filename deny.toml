# cargo-deny configuration (0.19.x)
# https://embarkstudios.github.io/cargo-deny/
#
# Run: cargo deny check  (or: just security-audit)

[advisories]
unmaintained = "workspace"
yanked = "warn"
# Ignore-list parity with foundation. Update both in lockstep when foundation
# changes. Each entry must be justified inline (transitive crate, no fix
# available, why the path is not in our exposure surface).
ignore = [
    # rustls-pemfile 2.2.0 unmaintained — transitive via tonic 0.12; no fix
    # until tonic 0.13. Mirrors foundation. Not on our code path.
    "RUSTSEC-2025-0134",
    # bincode 1.3.3 unmaintained (advisory dated 2025-12-16) — direct dep used
    # only to serialize/deserialize trusted local cache files in
    # crates/mnemos/src/storage/mod.rs (no untrusted input). Migration to
    # bincode 2.x tracked separately; revisit when foundation picks it up.
    "RUSTSEC-2025-0141",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
]

# Private/unpublished crates (proprietary + internal)
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "allow"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
